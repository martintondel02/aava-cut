name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-release:
    name: Build Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and server bundle
        run: npm run build

      - name: Build AppImage and .deb
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Generate SHA-256 checksums
        run: cd release && sha256sum LumaCut-*.AppImage LumaCut-*.deb > SHA256SUMS

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LumaCut-*.AppImage
            release/LumaCut-*.deb
            release/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
