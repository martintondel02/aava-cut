<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090c"/>
      <stop offset=".52" stop-color="#09161a"/>
      <stop offset="1" stop-color="#08090f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dffea"/>
      <stop offset=".5" stop-color="#72f5d1"/>
      <stop offset="1" stop-color="#6a8dff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfffee"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#72f5d1" stop-opacity=".32"/>
      <stop offset="1" stop-color="#72f5d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#6a8dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6a8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162026"/>
      <stop offset="1" stop-color="#0b1014"/>
    </linearGradient>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6f78"/>
      <stop offset="1" stop-color="#123a49"/>
    </linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b3f64"/>
      <stop offset="1" stop-color="#44263c"/>
    </linearGradient>
    <linearGradient id="clipC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b4b1d"/>
      <stop offset="1" stop-color="#3b2b15"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="monitorClip"><rect x="18" y="56" width="614" height="230" rx="10"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)" opacity=".5"/>
  <ellipse cx="300" cy="390" rx="420" ry="240" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="1390" cy="120" rx="480" ry="270" fill="url(#glow2)" filter="url(#blur1)"/>
  <path d="M0 447 C 280 400, 480 480, 760 420 S 1240 370, 1600 430 L1600 520 L0 520Z" fill="#05080a" opacity=".8"/>

  <!-- logo mark -->
  <g transform="translate(82 92)">
    <rect x="0" y="0" width="92" height="92" rx="26" fill="#0c1418" stroke="#ffffff" stroke-opacity=".14"/>
    <path d="M22 69 46 25l24 44" fill="none" stroke="url(#mint)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 56h28" fill="none" stroke="url(#mint)" stroke-width="6.5" stroke-linecap="round" opacity=".76"/>
    <path d="M14 78c11-4 22-4 32 0s21 4 32 0" fill="none" stroke="#7CFFDE" stroke-width="2.4" stroke-linecap="round" opacity=".58"/>
    <circle cx="81" cy="22" r="5.4" fill="#FFCE7A"/>
  </g>

  <text x="82" y="263" font-family="Montserrat" font-size="112" font-weight="800" letter-spacing="-5" fill="url(#word)">Aava Cut</text>
  <text x="86" y="310" font-family="Montserrat" font-size="24" font-weight="600" letter-spacing="7" fill="#72f5d1" fill-opacity=".86">EVERY CRAFT · ONE CURRENT</text>
  <text x="86" y="352" font-family="Open Sans" font-size="19" fill="#8a969d">A local-first video editor from Aava. Built for Linux.</text>

  <!-- feature chips -->
  <g transform="translate(86 390)" font-family="Montserrat" font-size="12" font-weight="600" letter-spacing=".7">
    <rect x="0" y="0" width="148" height="34" rx="17" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="74" y="22" text-anchor="middle" fill="#c3ccd0">MULTI-TRACK</text>
    <rect x="158" y="0" width="138" height="34" rx="17" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="227" y="22" text-anchor="middle" fill="#c3ccd0">KEYFRAMES</text>
    <rect x="306" y="0" width="122" height="34" rx="17" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="367" y="22" text-anchor="middle" fill="#c3ccd0">CAPTIONS</text>
    <rect x="438" y="0" width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="490" y="22" text-anchor="middle" fill="#c3ccd0">4K MP4</text>
    <rect x="552" y="0" width="108" height="34" rx="17" fill="#72f5d1" fill-opacity=".12" stroke="#72f5d1" stroke-opacity=".2"/>
    <text x="606" y="22" text-anchor="middle" fill="#72f5d1">OPEN SOURCE</text>
  </g>

  <!-- stylized editor card -->
  <g transform="translate(878 78) rotate(1.2)">
    <rect width="650" height="380" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="1" y="1" width="648" height="38" rx="17" fill="#0d1115" stroke="#ffffff" stroke-opacity=".05"/>
    <circle cx="22" cy="20" r="4" fill="#ff6b8a" opacity=".8"/>
    <circle cx="37" cy="20" r="4" fill="#ffc76b" opacity=".8"/>
    <circle cx="52" cy="20" r="4" fill="#72f5d1" opacity=".8"/>
    <rect x="250" y="15" width="150" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
    <circle cx="598" cy="20" r="5" fill="#72f5d1"/>
    <rect x="614" y="14" width="20" height="12" rx="6" fill="#ffffff" fill-opacity=".06"/>

    <!-- monitor -->
    <rect x="18" y="56" width="614" height="230" rx="10" fill="#05070a"/>
    <rect x="18" y="56" width="614" height="230" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
    <g clip-path="url(#monitorClip)">
      <rect x="18" y="56" width="614" height="230" fill="#06101b"/>
      <ellipse cx="470" cy="120" rx="230" ry="130" fill="#6a8dff" opacity=".15" filter="url(#soft2)"/>
      <path d="M0 145 C 100 80, 220 155, 340 105 S 520 95, 660 150 L660 210 C 500 145, 380 190, 260 160 S 80 150, 0 195Z" fill="#72f5d1" opacity=".22" filter="url(#soft2)"/>
      <path d="M0 175 C 130 115, 280 195, 430 135 S 590 145, 660 175" fill="none" stroke="#b8fff0" stroke-width="5" opacity=".25" filter="url(#soft2)"/>
      <path d="M18 235 L110 185 L190 232 L270 165 L380 245 L470 195 L560 250 L632 185 L632 286 L18 286Z" fill="#030a0f" opacity=".92"/>
      <path d="M18 258 L130 220 L230 265 L340 210 L470 272 L570 225 L632 255 L632 286 L18 286Z" fill="#02070a"/>
      <text x="325" y="126" text-anchor="middle" font-family="Montserrat" font-size="8" font-weight="700" letter-spacing="4.5" fill="#d8fff7" fill-opacity=".8">AN AAVA FILM</text>
      <text x="325" y="173" text-anchor="middle" font-family="Montserrat" font-size="33" font-weight="900" letter-spacing="-1" fill="#ffffff">CHASE THE LIGHT</text>
      <rect x="303" y="190" width="44" height="1.5" fill="#72f5d1" opacity=".65"/>
    </g>

    <!-- timeline -->
    <rect x="18" y="300" width="614" height="64" rx="8" fill="#0a0e12" stroke="#ffffff" stroke-opacity=".05"/>
    <rect x="27" y="310" width="70" height="44" rx="5" fill="#10161b" stroke="#ffffff" stroke-opacity=".05"/>
    <rect x="86" y="314" width="10" height="6" rx="3" fill="#9c7bff"/>
    <rect x="86" y="326" width="10" height="6" rx="3" fill="#ffc76b"/>
    <rect x="86" y="338" width="10" height="6" rx="3" fill="#62e6c1"/>
    <rect x="86" y="350" width="10" height="6" rx="3" fill="#68a8ff"/>
    <rect x="106" y="315" width="130" height="11" rx="3" fill="url(#clipC)"/>
    <rect x="252" y="315" width="160" height="11" rx="3" fill="url(#clipC)"/>
    <rect x="106" y="331" width="220" height="12" rx="3" fill="url(#clipA)"/>
    <rect x="330" y="331" width="142" height="12" rx="3" fill="url(#clipB)"/>
    <rect x="476" y="331" width="100" height="12" rx="3" fill="url(#clipA)"/>
    <rect x="106" y="349" width="470" height="8" rx="3" fill="#173a45"/>
    <rect x="330" y="314" width="8" height="44" fill="#ff6b8a"/>

    <!-- keyframe diamonds -->
    <g fill="#72f5d1">
      <rect x="142" y="358" width="6" height="6" transform="rotate(45 145 361)"/>
      <rect x="202" y="358" width="6" height="6" transform="rotate(45 205 361)"/>
      <rect x="262" y="358" width="6" height="6" transform="rotate(45 265 361)"/>
    </g>
  </g>

  <!-- decorative light lines -->
  <g stroke="#72f5d1" stroke-opacity=".16" fill="none">
    <path d="M-40 510 C 380 440, 740 500, 1120 430 S 1590 370, 1800 420" stroke-width="1"/>
    <path d="M-40 498 C 380 428, 740 488, 1120 418 S 1590 358, 1800 408" stroke-width="1" stroke-opacity=".08"/>
  </g>
</svg>
