name: Feature request
description: Suggest an editor feature, workflow improvement or design change.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow you have today and where it hurts.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the behaviour, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Timeline
        - Preview / compositor
        - Text / captions
        - Audio / EQ / visualizer
        - Keyframes / animation
        - Export
        - Settings / theme
        - Desktop / packaging
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: local-first
    attributes:
      label: Local-first check
      options:
        - label: This request can work fully offline and does not require an account or cloud service.
